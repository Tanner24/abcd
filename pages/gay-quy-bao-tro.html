<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gây Quỹ và Bảo Trợ - Narthang</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/narthang-style.css">
    <style>
        #main-bg-engine {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background-size: cover; background-position: center;
            background-image: url('https://i.pinimg.com/736x/21/2b/43/212b43b2f8664654b4df9d264560ea3d.jpg');
            filter: brightness(0.3);
        }
        .content-section { max-width: 800px; margin: 100px auto; padding: 40px; background: rgba(0,0,0,0.7); border: 1px solid var(--narthang-gold); border-radius: 8px; text-align: center; }
        h1 { font-family: 'Playfair Display', serif; color: var(--narthang-gold); font-size: 3em; margin-bottom: 20px; }
        p { font-size: 1.2em; line-height: 1.8; color: #e0d7c6; }
    </style>
</head>
<body>
    <div id="bg-blur"></div>
    <div id="main-bg-engine"></div>
    <div class="content-section">
        <h1>Gây Quỹ và Bảo Trợ</h1>
        <p>Mọi sự đóng góp của quý vị đều góp phần vào việc gìn giữ và phát triển di sản văn hoá, tâm linh Narthang. Công đức hộ trì Tam Bảo sẽ mang lại sự bình an và trí tuệ bền vững.</p>
        <br>
        <a href="../index.html" style="color: var(--narthang-gold); text-decoration: none; border: 1px solid var(--narthang-gold); padding: 5px 15px;">← Quay lại</a>
    </div>
</body>
</html>
