    <style>
        .nav-sticky {

            justify-content: center;
            gap: 15px;
            z-index: 1000;

        }

        .flag-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--narthang-gold);
            cursor: pointer;
            transition: 0.3s;
            border-radius: 4px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            font-weight: 600;
            color: var(--lotus-white);
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .flag-btn:hover,
        .flag-btn.active-btn {
            background: var(--wisdom-gold);
            color: #000;
            box-shadow: 0 0 15px var(--wisdom-gold);
            transform: translateY(-2px);
        }

        .flag-btn img {
            width: 20px;
            height: 14px;
            margin-right: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .mahasiddha-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 40px;
            width: 100%;
        }

        .lang-page {
            display: none;
            width: 100%;
        }

        .lang-page.active-page {
            display: block;
        }

        .card-num {
            color: var(--wisdom-gold);
            font-weight: 800;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-family: 'Montserrat', sans-serif;
        }

        .card-name {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--lotus-white);
            font-family: 'Playfair Display', serif;
            letter-spacing: 1px;
        }

        .card-bio {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--narthang-gold);
            font-style: italic;
            font-family: 'EB Garamond', serif;
        }

        /* Override bento-item for this page */
        .bento-item {
            justify-content: flex-start;
            min-height: 250px;
        }

        .header-box h1 {
            font-size: 4rem;
        }

        @media (max-width: 768px) {
            .header-box h1 {
                font-size: 2.5rem;

                font-size: 0.7rem;

        const localObserver = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, { threshold: 0.1 });

        function fillGrid() {
            const langs = ['vi', 'en', 'zh', 'bo'];
            langs.forEach((lang, langIdx) => {
                const grid = document.getElementById(`grid-${lang}`);
                if (!grid) return;
                grid.textContent = '';
                data.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'bento-item reveal';
                    card.style.transitionDelay = `${(index % 20) * 0.05}s`;

                    let orderDisplay;
                    if (lang === 'vi') {
                        orderDisplay = `Bậc Thánh ${ordinalsVi[item.id - 1]}`;
                    } else if (lang === 'bo') {
                        orderDisplay = `གྲུབ་ཐོབ་ #${item.id}`;
                    } else {
                        orderDisplay = `Siddha #${item.id}`;
                    }

                    const numDiv = document.createElement('div');
                    numDiv.className = 'card-num';
                    numDiv.textContent = orderDisplay;

                    const nameH3 = document.createElement('h3');
                    nameH3.className = 'card-name';
                    nameH3.textContent = item.name[langIdx];

                    const bioDiv = document.createElement('div');
                    bioDiv.className = 'card-bio';
                    bioDiv.textContent = item.bio[langIdx];

                    card.appendChild(numDiv);
                    card.appendChild(nameH3);
                    card.appendChild(bioDiv);

                    // Add hover effects for background engine
                    card.onmouseenter = () => {
                        if (window.hub) window.hub('https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Narthang_Monastery.jpg/1280px-Narthang_Monastery.jpg', item.name[langIdx].toUpperCase());
                    };
                    card.onmouseleave = () => {
                        if (window.res) window.res();
                    };

                    grid.appendChild(card);
                    localObserver.observe(card);
                });
            });
        }

        function setLang(langId) {
            localStorage.setItem('selectedLanguage', langId);

            document.querySelectorAll('.lang-page').forEach(p => p.classList.remove('active-page'));
            const targetPage = document.getElementById(langId);
            if (targetPage) targetPage.classList.add('active-page');

            document.querySelectorAll('.flag-btn').forEach(btn => btn.classList.remove('active-btn'));
            const activeBtn = document.getElementById('btn-' + langId);
            if (activeBtn) activeBtn.classList.add('active-btn');

            const pageTitle = document.getElementById('page-title');
            if (pageTitle) pageTitle.textContent = titles[langId];

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = function () {
            fillGrid();
            const savedLang = localStorage.getItem('selectedLanguage') || 'vi';
            setLang(savedLang);

            // Initialize Narthang effects if available
            if (window.changeBg) {
                window.changeBg('https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Narthang_Monastery.jpg/1280px-Narthang_Monastery.jpg');
            }
        };
